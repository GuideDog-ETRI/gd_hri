PARTICIPANT_ANNOUNCE_DELAY:
  sec: 0
  nanosec: 0

PARTICIPANT_ANNOUNCE_INTERVAL:
  sec: 5
  nanosec: 0

PARTICIPANT_ANNOUNCE_ASSERT_UNICAST: false # true | false

BUILTIN_HEARTBEAT_INTERVAL:
  sec: 0
  nanosec: 15000000

HEARTBEAT_INTERVAL:
  sec: 3
  nanosec: 0

HEARTBEAT_PER_MAX_SAMPLES: 8

LEASE_DURATION:
  sec: 10
  nanosec: 0

DATA:
  allow_loopback: true
  intra_process: false
  tx_limit: 0 # bps, 0 means unlimited
  mtu: 8192 # auto | number(1472)
  buffer_capacity: 512
  shmem_size: 100 # shared memory pool size in MiB, 0 means disabled
  data_sharing: # Up to 32 can be set.
  - topic: "*" # Apply to topics matching the pattern.
    kind: disable # disable | auto | explicit
    max_samples: 0 # Use only when 'explicit'
    max_size_per_sample: 0 # Use only when 'explicit'

MULTICAST_MINIMUM_PARTICIPANT_COUNT: 10
BATCH_PROCESSING: true
USE_VENDOR_SPECIFIC_PARAMETER: false
EVENT_DATA_BUFFER_MAX_SIZE: 1024

WIRE:
  interface:
  - domain: default # default | domain-number(11)
    interface: eth0 # auto | interface-name(eth0) | interface-address(x.x.x.x)
  rtps:
    # socket buffer size
    sndbuf: 10485760
    rcvbuf: 10485760
  enable_loopback: false
  enable_mobility: false # Enable IP mobility for participants set to 'auto' or 'interface-name'

LOGGING:
  type: stdio # stdout | stderr | stdio | file
  level: error # | debug | info | warn | error | fatal
  file:
    # configuration for file logger
    path: gurumdds.log.${pid} # ${value} value -> pid | environment variable
    max_size: 10485760 # maximum log file size in bytes
    max_rotation: 8 # maximum log file rotation
    max_lifespan: 0 # maximum log file lifespan in seconds (zero for unlimited lifespan)

MONITORING:
  enabled: false
  publication:
    publication_period: # Publication period of statistics data
      sec: 1
      nanosec: 0
    entities:
      - DomainParticipantDescription
      - DomainParticipantEntityStatistics
      - DataWriterDescription
      - DataWriterEntityStatistics
      - DataReaderDescription
      - DataReaderEntityStatistics

