vlm:
  server_ip_addr: "http://localhost:8000/v1"
  # server_ip_addr: "http://129.254.87.76:8000/v1"
  model_path: "/workspace/Qwen2.5-VL/sa-vlm/checkpoint-6430_qwen2.5vl-3b_mSAIT_kr"  
  # model_path: "Qwen/Qwen2.5-VL-7B-Instruct"
  # model_path: "Qwen/Qwen2.5-VL-3B-Instruct"
  system_content: "You are a guide dog that delivers information about the surrounding environment to the blind."
  user_content: "Please answer what you see on the floor and translate the whole answer into Korean."
  # image_ai_node -> guidedog VLM 서버 (ZMQ XPUB)
  zmq_pub_addr: "tcp://*:5555"
  sub_timeout: 1.0      # VLM 서버(SUB) 연결 대기 시간(초), 넘으면 전송 취소
  # prompts sent to SA-VLM server per voice command. {goal_x}, {goal_y} are replaced with the normalized goal point.
  # [2026-10-06] 2026-10-01 RFM lab 메일 양식 [요약]/[일반]/[상세] 사용 (src/utils/guidedog-zmq-test.py와 동일).
  #   [일반]/[상세]/[요약] 앞의 \n 은 학습 데이터 형식. goal은 학습 데이터처럼 소수점 2자리로 넣음. 빈 문자열이면 질문 없이 전송 (서버 -p 프롬프트). "이전:" 은 savlm-variants 문구
  prompts:
    # A: RUN_SAVLM (지금상황어때)
    situation: "\n[일반] 이미지를 분석하여 목표 위치 ({goal_x}, {goal_y})를 기반으로 시각 장애인을 위한 간단한 도보 안내를 제공해 주세요."
    # 이전: "이미지는 실내환경입니다. 이미지를 분석하여 목표 위치 ({goal_x:.4f}, {goal_y:.4f})를 기반으로 시각 장애인을 위한 간단한 도보 안내를 제공해 주세요."
    # B: RUN_SAVLM_DETAIL (상황자세히알려줘)
    detail: "\n[상세] 이미지를 분석하여 목표 위치 ({goal_x}, {goal_y})를 기반으로 장애물의 방향과 위치 정보를 포함한 시각 장애인을 위한 간단한 도보 안내를 제공해 주세요."
    # 이전: "이미지를 분석하여 목표 위치 ({goal_x:.4f}, {goal_y:.4f})를 기반으로 시각 장애인을 위한 도보 안내를 제공해 주세요. 목적지, 좌측, 우측, 경로상 장애물을 각각 시계 방향과 미터 거리로 설명하고, 마지막에 보행 가능 여부와 그 이유를 말해 주세요."
    # C: RUN_SAVLM_BRIEF (보행가능해)
    brief: "\n[요약] 이미지를 분석하여 목표 위치 ({goal_x}, {goal_y})를 기반으로 시각 장애인을 위한 간단한 도보 안내를 제공해 주세요."
    # 이전: "이미지를 분석하여 목표 위치 ({goal_x:.4f}, {goal_y:.4f})를 기반으로 보행 가능 여부를 먼저 말하고, 가능하면 이동할 시계 방향과 미터 거리를, 불가능하면 그 이유와 우회 경로 유무를 한두 문장으로 간단히 말해 주세요."
    # [2026-10-06] 대화 모드 자유 질문 (STT.dialog). {question} = 인식된 문장 원문. 태그가 없으므로 VLM 서버는 free 모드.
    #   [일반]/[상세]/[요약] 과 달리 앞에 \n 없음 (학습 데이터 형식)
    dialog: "{question}"

openai_whisper:
  WHISPER_MODEL_NAME: "large-v3-turbo"
  MIC_SAMPLE_RATE: 16000
  ENERGY_THRESHOLD: 1000
  # RECORD_TIMEOUT: 2.0   # [2026-10-23] 원본. 2초 넘는 명령이 잘려 두 조각으로 나뉘어 매칭 실패 ("지금 지하..." + "멈춰 입구 찾아")
  RECORD_TIMEOUT: 4.0     # 한 문장 최대 녹음 길이(초). 말이 끝나고 0.8초 조용하면 바로 끊으므로 짧은 명령 반응 속도는 같음
  PHRASE_TIMEOUT: 1.0
  # [2026-10-23] 샥즈 녹음 실측으로 정한 값 (말소리 rms 3000~4500, 주변 소음 rms 약 40)
  LANGUAGE: "ko"                 # null 이면 자동 판별 (자동 판별 시 짧은 명령이 다른 언어로 판별될 수 있음)
  INITIAL_PROMPT: "에디야, 멈춰. 에디야, 가자. 지금 상황 어때? 신호등 찾아."   # 호출어·명령 힌트 ("에디야"가 "애리야"로 들리던 문제)
  MIN_AVG_LOGPROB: -1.0          # 이보다 낮으면 무음·잡음에서 지어낸 문장으로 보고 버림 (실제 말 -0.04~-0.27, 지어낸 문장 -2.6~-7.9)
  # MAX_ENERGY_THRESHOLD: 1500   # [2026-10-23] 원본. 재연결 직후 보정이 1500으로 잘렸는데 말소리 rms가 1100~1400이라 작은 말은 놓칠 수 있음
  MAX_ENERGY_THRESHOLD: 1000     # 주변 소음 보정 결과 상한 (보정 중 말소리가 섞이면 2000~3500 으로 튀던 문제, 평소 보정값 440~460)

STT:
  use_trigger_word: True
  trigger_word: "에디야"
  # [2026-10-06] 대화 모드: start_words 로 시작, end_words 로 종료 (트리거 단어 없이도 인식, 공백 무시).
  #   대화 모드 중에도 audio_cmd_list.txt 의 명령은 그대로 동작하고,
  #   명령에 매칭되지 않는 문장은 원문 그대로 VLM 자유 질문으로 보냄 (/GDH_dialog_text -> image_ai_node, vlm.prompts.dialog)
  dialog:
    start_words: ["대화시작", "대화시작해", "안녕에디"]
    end_words: ["대화종료", "대화종료해", "그만에디"]
    use_timeout: True      # 말이 없으면 자동 종료
    timeout_sec: 10.0      # 마지막으로 인식된 문장 이후 이 시간(초) 동안 인식된 문장이 없으면 종료
    start_sentence: "대화를 시작합니다."   # 시작/종료 안내 음성 (빈 문자열이면 안내 안 함)
    end_sentence: "대화를 종료합니다."
